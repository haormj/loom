# Loom 参考目录 — Vendor 基线
#
# 本文件是参考路由/组/条目元数据的唯一声明式来源。
# 它从 contracts、architecture、execution 和 deploy crate 中的硬编码
# enum 函数及 match 分支机械导出。
#
# Phase 0:本文件与现有硬编码逻辑并存;reference_catalog/tests/parity.rs
# 中的 parity 测试验证两者一致。Phase 1 将把选择代码路径切换为从本目录读取。
#
# 约定:模板中的 {item} 替换为条目 id。

schemaVersion = 1

