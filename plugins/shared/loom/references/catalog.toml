  [[routes.prependItems]]
  refId = "tech.code.common"
  path = "tech/code/common.md"
  reason = "Common Loom code quality rules for repository adaptation, delivery evidence, and verification."
  condition = "when_groups_non_empty"

  # ── common 组:特殊路径(非 tech/code/common/observability.md)──
  [[routes.groups]]
  id = "common"
  label = "Common"
