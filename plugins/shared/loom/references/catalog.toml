# ════════════════════════════════════════════════════════════════════════
# 适用性规则
# 替代 contracts/code_quality.rs 中的 signal_applies_to_task() 函数
# 来源:code_quality.rs:1235-1287
#
# 规则语义:
# - language: 匹配 signal.language("*" = 任意非 None,"none" = None)
# - requiredRole: signal.roles 必须包含此角色(可选)
# - anyFocusTags: task 的 focusTags 包含其中任意一个即匹配(空 = 无条件)
# - appliesWhenRolesEmpty: 仅在 roles 为空时生效(对应原 unclassified 分支)
# ════════════════════════════════════════════════════════════════════════

[[applicability]]
language = "sql"
anyFocusTags = ["sql", "persistence", "performance", "analytics"]

# typescript: 无条件部分
[[applicability]]
language = "typescript"
anyFocusTags = ["frontend", "configuration", "runtime", "migration"]

# typescript: backend 角色门控部分
[[applicability]]
language = "typescript"
requiredRole = "backend"
anyFocusTags = ["api", "backend", "testing"]

# javascript: 无条件部分
[[applicability]]
language = "javascript"
anyFocusTags = ["frontend"]

# javascript: backend 角色门控部分
[[applicability]]
language = "javascript"
requiredRole = "backend"
anyFocusTags = ["api", "backend", "testing"]

# 通用语言 catch-all (*): frontend 角色
[[applicability]]
language = "*"
requiredRole = "frontend"
anyFocusTags = ["frontend"]

# 通用语言 catch-all (*): backend 角色
[[applicability]]
language = "*"
requiredRole = "backend"
anyFocusTags = ["backend", "api", "persistence", "security", "configuration", "runtime", "integration", "migration", "architecture", "testing"]

# 通用语言 catch-all (*): persistence 角色
[[applicability]]
language = "*"
requiredRole = "persistence"
anyFocusTags = ["persistence"]

# 通用语言 catch-all (*): roles 为空时的 unclassified 分支
[[applicability]]
language = "*"
appliesWhenRolesEmpty = true
anyFocusTags = ["api", "backend", "persistence", "security", "configuration", "runtime"]

# language = None: frontend 角色
[[applicability]]
language = "none"
requiredRole = "frontend"
anyFocusTags = ["frontend"]

# ════════════════════════════════════════════════════════════════════════
# Focus tag 文本关键词规则
# 替代 contracts/code_quality.rs 中 task_focus_tags() 的文本匹配部分
# 来源:code_quality.rs:725-1216
#
# 规则语义:
# - keywords: task 文本(title+objective+actions,已规范化为小写+空格分隔)
#   包含其中任意一个即匹配
# - focusTags: 匹配成功时添加的标签(去重)
# - requiresBackend: 仅当 task 为后端任务时才匹配(cache 规则的守卫)
