# Browser 路由 — 替代 playwright_reference_load_plan()
# 来源:contracts/browser_quality.rs:175-246
# ════════════════════════════════════════════════════════════════════════

[[routes]]
id = "browser"
referenceRoot = "loom"

  [[routes.groups]]
  id = "playwright"
  items = ["core", "locators", "configuration", "fixtures", "network", "visual", "accessibility", "reliability"]
  requiredSections = ["## Implementation Focus", "## Verification Focus"]

  # 显式条目捕获 playwright_reference_load_plan() 中的非标准 refId 映射和
  # 选择条件。
  [[routes.groups]]
  id = "playwright_explicit"
    [[routes.groups.itemEntries]]
    item = "core"
    refId = "test.pw.core"
    path = "tech/test/playwright/core.md"
    reason = "Playwright task boundary, runner adaptation, and deterministic execution rules."
    condition = "always"

    [[routes.groups.itemEntries]]
    item = "locators"
    refId = "test.pw.locators"
    path = "tech/test/playwright/locators.md"
    reason = "Playwright locator, assertion, and auto-waiting rules for browser checks."
    condition = "always"

    [[routes.groups.itemEntries]]
    item = "configuration"
    refId = "test.pw.config"
    path = "tech/test/playwright/configuration.md"
    reason = "Playwright project configuration, web server, artifact, and CI setup rules."
    condition = "suite_setup_or_non_existing_project"

    [[routes.groups.itemEntries]]
    item = "fixtures"
    refId = "test.pw.fixtures"
    path = "tech/test/playwright/fixtures.md"
    reason = "Task-scoped fixture, authentication, test-data, and reusable workflow rules."
    condition = "business_flow_mode"

    [[routes.groups.itemEntries]]
    item = "network"
    refId = "test.pw.network"
    path = "tech/test/playwright/network.md"
    reason = "Request synchronization, API-backed state control, and mock-versus-real boundary rules."
    condition = "action_refs_or_submitting_state"

    [[routes.groups.itemEntries]]
    item = "visual"
    refId = "test.pw.visual"
    path = "tech/test/playwright/visual.md"
    reason = "Rendered viewport, screenshot, visual comparison, and layout stability rules."
    condition = "rendered_inspection_or_viewport_rule"

    [[routes.groups.itemEntries]]
    item = "accessibility"
    refId = "test.pw.a11y"
    path = "tech/test/playwright/accessibility.md"
    reason = "Browser-level semantic, keyboard, focus, and accessibility evidence rules."
    condition = "accessibility_quality_rule"

