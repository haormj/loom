# Builtin Loom Playbook — default registry
#
# Single source of truth for reference id -> file path mapping.
# Byte-equivalent with the prior hardcoded reference_load_plan_item logic in
# contracts/code_quality.rs. Editing this file changes what Loom installs,
# selects, and reads — without touching Rust.
#
# Lookup key for code references is (group_key, group). Each entry carries the
# stable ref_id, the repository-relative content path, and the human reason.
# Enterprise playbooks (mode: extend) may add or override entries; mode: base
# replaces this table wholesale.

schema_version: 1
playbook: default
mode: base

# Always-prepended common code-quality reference (code_reference_load_plan
# emits this once when any code reference group is active).
code_common:
  ref_id: tech.code.common
  path: tech/code/common.md
  reason: "Common Loom code quality rules for repository adaptation, delivery evidence, and verification."

# (group_key, group) -> { ref_id, path, reason }
code_refs:
  common:
    observability:
      ref_id: tech.code.observability
      path: tech/code/observability.md
      reason: "Selected the task-owned cross-stack observability implementation reference."

